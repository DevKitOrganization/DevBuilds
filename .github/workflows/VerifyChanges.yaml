name: Verify Changes
on:
  merge_group:
  pull_request:
    branches: "**"
  push:
    branches: ["main"]

jobs:
  test:
    name: Test
    runs-on: macos-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Run Tests
        run: python3 -m unittest discover -s Tests -v
